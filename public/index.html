<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>小说临时搜索</title>
</head>
<body>
  <main>
    <h1>小说搜索</h1>
    <p class="sub">输入书名、作者或任意一个关键字</p>
    <form id="searchForm">
      <div class="searchRow">
        <input id="q" type="search" autocomplete="off" placeholder="输入关键字" required>
        <button id="searchBtn" type="submit">搜索</button>
      </div>
      <div class="tabs" id="tabs">
        <button type="button" data-category="全部" class="active">全部</button>
        <button type="button" data-category="言情">言情</button>
        <button type="button" data-category="耽美">耽美</button>
        <button type="button" data-category="男生">男生</button>
      </div>
      <div class="tabs"><button type="button" id="correctionsOnly" aria-pressed="false">只看分类纠正</button></div>
    </form>
    <div class="statusRow"><span id="status">正在读取数据更新时间…</span></div>
    <section id="results"></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
